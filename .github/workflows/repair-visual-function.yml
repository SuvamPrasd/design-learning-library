name: Repair visual function

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair duplicate visual declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          bad="</div>';function visual(t){let n=t.name.toLowerCase();if(n.includes('fitts'))"
          if bad in s:
              s=s.replace(bad,"</div>" if False else "</div>';function visual(t){let n=t.name.toLowerCase();if(n.includes('fitts'))",1)
          # Remove only the extra opening visual function introduced by the updater.
          prefix="function visual(t){let n=t.name.toLowerCase();if(n.includes('tesler'))return '<div class=\"visualrow\"><div class=\"step\"><b>Manual complexity</b><small>User carries the work</small></div><div class=\"arrow\">→</div><div class=\"step\"><b>Smart default</b><small>System carries routine work</small></div><div class=\"arrow\">→</div><div class=\"step\"><b>Expert control</b><small>User can override</small></div></div>';if(n.includes('serial position'))return '<div class=\"visualrow\"><div class=\"step\"><b>01 · First</b><small>High recall</small></div><div class=\"step\"><b>02–04 · Middle</b><small>Lower recall</small></div><div class=\"step\"><b>05 · Last</b><small>High recall</small></div></div>';if(n.includes('feedback loop'))return '<div class=\"visualrow\"><div class=\"step\"><b>Act</b><small>User changes something</small></div><div class=\"arrow\">→</div><div class=\"step\"><b>Respond</b><small>System shows state</small></div><div class=\"arrow\">→</div><div class=\"step\"><b>Interpret</b><small>User understands</small></div><div class=\"arrow\">→</div><div class=\"step\"><b>Next action</b><small>Loop continues</small></div></div>';"
          if prefix in s:
              s=s.replace(prefix,'',1)
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair learning library visual renderer'
          git push
      - name: Remove repair workflow
        if: success()
        run: |
          git rm .github/workflows/repair-visual-function.yml
          git commit -m 'Remove visual repair workflow'
          git push