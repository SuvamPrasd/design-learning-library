name: One-time topic repair

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Daily design learning topics')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append new topics safely
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = "\n];\nconst cats="
          if marker not in s:
              raise SystemExit('topics marker not found')
          new_topics = r'''T('Tesler’s Law','Product thinking','Every product has irreducible complexity; the design challenge is deciding who carries it: the user, the system, or the team.','Complexity cannot always be removed — it can be relocated and managed.',['Complexity','Defaults','Automation','Control'],'A principle that some complexity is inherent to a task and must exist somewhere in the system.','Trying to make a complex task look simple can hide complexity and create surprise later.','Identify unavoidable complexity, automate what the system can safely handle, and expose user control where it matters.','Professional tools, setup flows, permissions, configuration and enterprise software.',['Lower cognitive load','Better defaults','Clearer trade-offs','More honest interfaces'],'A hearing-aid fitting tool can automate routine calibration while exposing advanced controls for HCPs who need them.','You cannot delete every complexity; decide who should carry it.','Hiding complexity without providing control can make expert workflows harder.'),
T('Serial position effect','HCI & psychology','People tend to remember items at the beginning and end of a sequence better than items in the middle.','Position changes what gets remembered.',['Memory','Ordering','Primacy','Recency'],'A memory effect where the first and last items in a sequence often have stronger recall.','Order can influence what users notice and remember even when content is otherwise equal.','Put critical information at high-value positions and avoid relying on position alone for essential meaning.','Onboarding, menus, checklists, search results and instructional content.',['Better recall','Stronger sequencing','Clearer priorities','More intentional flows'],'An onboarding flow can introduce the core value first and end with the most important next action.','Sequence is part of information architecture.','Do not bury critical information in the middle and assume users will remember it.'),
T('Feedback loop design','Interaction','A strong interaction loop connects user action, system response, interpretation and the next decision.','Action without useful feedback leaves the loop unfinished.',['Feedback','State','Response','Iteration'],'A recurring cycle in which an action changes system state and that state informs the next action.','Users need to know what happened before deciding what to do next.','Make state changes visible, timely and meaningful; then support the next action.','AI tools, editors, forms, clinical software, collaboration and dashboards.',['Confidence','Learnability','Error recovery','Flow'],'After changing a fitting parameter, show the updated device state and make the next relevant action obvious.','Close the loop: act → see → understand → decide.','A generic spinner is feedback about activity, not necessarily about outcome.')'''
          s = s.replace(marker, "\n" + new_topics + marker, 1)
          old = "function visual(t){let n=t.name.toLowerCase();"
          if old not in s:
              raise SystemExit('visual marker not found')
          cases = r'''function visual(t){let n=t.name.toLowerCase();if(n.includes('tesler'))return '<div class="visualrow"><div class="step"><b>Manual complexity</b><small>User carries the work</small></div><div class="arrow">→</div><div class="step"><b>Smart default</b><small>System carries routine work</small></div><div class="arrow">→</div><div class="step"><b>Expert control</b><small>User can override</small></div></div>';if(n.includes('serial position'))return '<div class="visualrow"><div class="step"><b>01 · First</b><small>High recall</small></div><div class="step"><b>02–04 · Middle</b><small>Lower recall</small></div><div class="step"><b>05 · Last</b><small>High recall</small></div></div>';if(n.includes('feedback loop'))return '<div class="visualrow"><div class="step"><b>Act</b><small>User changes something</small></div><div class="arrow">→</div><div class="step"><b>Respond</b><small>System shows state</small></div><div class="arrow">→</div><div class="step"><b>Interpret</b><small>User understands</small></div><div class="arrow">→</div><div class="step"><b>Next action</b><small>Loop continues</small></div></div>';'''
          s = s.replace(old, cases + old, 1)
          p.write_text(s)
          PY
      - name: Commit updated library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Daily design learning topics" || exit 0
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/one-time-topic-repair.yml
          git commit -m "Remove one-time topic repair"
          git push